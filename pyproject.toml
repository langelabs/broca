[project]
name = "broca"
version = "0.1.0"
description = "Local AI inference and model management by Lange Labs."
authors = [{ name = "hey@robertlange.me" }]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "certifi==2026.11.20",
    "fastapi>=0.165.0",
    "filelock>=4.3.0",
    "huggingface-hub>=1.33.0,<2",
    "idna>=3.20",
    "pydantic>=2.14.4,<3.0.0",
    "python-multipart>=0.0.34,<1",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
    "accelerate>=1.16.0,<2",
    "av>=19.0.2,<20",
    "diffusers>=0.43,<0.44",
    "ftfy>=6.3.1,<7",
    "gguf>=0.19.0,<1",
    "llama-cpp-python>=0.3.38,<0.4",
    "pillow>=13.0.0",
    "protobuf>=7.36.2",
    "safetensors>=0.8.0,<1",
    "sentencepiece>=0.2.3,<1",
    "sentence-transformers>=6.3.0,<7",
    "torch>=2.15.0,<3",
    "torchvision>=0.29.2,<1",
    "transformers>=5.24.0,<6",
    "chonkie>=1.7.0",
    "docling>=2.151.1,<3",
]

[tool.poetry]
packages = [{ include = "broca" }]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29.0",
    "pytest>=9.2.0,<10.0.0",
    "ruff>=0.17.6",
]
benchmarks = ["openai>=3.57.0"]
