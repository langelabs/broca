name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check uv lockfile
        run: uv lock --check

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Run pytest
        run: uv run --locked pytest -q

      - name: Run JavaScript tests
        run: node --test tests/*.mjs

      - name: Build package
        run: uv build

  mesh:
    name: Build and smoke-test Mesh
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and smoke-test the image
        uses: ./.github/actions/build-mesh
        with:
          version: ci
